# 部署到 GitHub Pages（项目站点：https://<user>.github.io/fullstack-learning-site/）
# 参考 silver-bullet 的部署方式：构建 .vitepress/dist 后用 gh-pages 分支发布
name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Install
        run: |
          set +e
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            # 把错误输出为 annotation，便于匿名读取排查
            tail -n 40 install.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit $rc
          fi

      - name: Upload install log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: install-log
          path: install.log

      - name: Build
        run: pnpm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .vitepress/dist
          publish_branch: gh-pages
